version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb

  web:
    image: nginx:latest
    ports:
      - "8080:80"
    command: /bin/sh -c "echo 'Welcome Digilian' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"
    depends_on:
      - db